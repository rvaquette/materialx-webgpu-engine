name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Checkout MaterialX
        uses: actions/checkout@v5
        with:
          repository: rvaquette/MaterialX
          ref: bea1e9251d8f936a73930ad19a6f3b37265d46f5
          path: materialx

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8

      - name: Install application dependencies
        run: npm ci

      - name: Build minimal MaterialX Core and static site
        run: npm run build
        env:
          MX_SOURCE_DIR: ${{ github.workspace }}/materialx

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5