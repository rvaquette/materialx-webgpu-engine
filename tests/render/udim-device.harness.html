<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>UDIM device validation</title>
<pre id="result">Running...</pre>
<script type="module">
  import { runUdimDeviceCheck } from './udim-device.harness.ts';
  try {
    globalThis.__UDIM_REPORT__ = await runUdimDeviceCheck();
    document.getElementById('result').textContent = JSON.stringify(globalThis.__UDIM_REPORT__);
  } catch (error) {
    globalThis.__UDIM_REPORT__ = { error: String(error) };
    document.getElementById('result').textContent = String(error);
    console.error(error);
  }
</script>
</html>
