<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaterialX - image raster GPU device</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; }
      img { image-rendering: pixelated; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <h1>Image raster rendue sur le GPU du mobile</h1>
    <div id="log"></div>
    <script type="module">
      import { bootstrapImage } from '/tests/render/scene-device.harness.ts';
      const params = new URLSearchParams(location.search);
      const scene = params.get('scene') ?? 'standard_surface_carpaint';
      const res = Number(params.get('res') ?? 256);
      bootstrapImage(scene, res).catch((e) => {
        const p = document.createElement('p');
        p.textContent = 'Echec: ' + (e && e.message ? e.message : e);
        document.body.appendChild(p);
      });
    </script>
  </body>
</html>
