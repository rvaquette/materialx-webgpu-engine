<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaterialX WebGPU Engine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #canvas-container {
        position: relative;
        flex: none;
        width: 512px;
        max-width: 100%;
        align-self: center;
      }
      canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        display: block;
        object-fit: contain;
        touch-action: none;
        user-select: none;
      }
      #status {
        padding: 8px 12px;
        font-size: 13px;
      }
      #busy-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        max-width: 100%;
        width: max-content;
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(16, 16, 20, 0.85);
        pointer-events: none;
        font-size: 13px;
      }
      #busy-indicator[hidden] { display: none; }
      #busy-indicator::before {
        content: "";
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border: 2px solid #3a3a44;
        border-top-color: #91d5c4;
        border-radius: 50%;
        animation: busy-spin 0.8s linear infinite;
      }
      @keyframes busy-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #busy-indicator::before { animation: none; }
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #26262c;
      }
      #toolbar label {
        font-size: 13px;
        color: #a8a8b0;
      }
      #toolbar select, #material-controls select {
        background: #1c1c22;
        color: #e6e6e6;
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 13px;
        min-height: 44px;
        max-width: 100%;
      }
      #materials-panel, #shader-errors-panel, #import-warnings-panel {
        border-bottom: 1px solid #26262c;
        padding: 0 12px;
      }
      #materials-panel summary, #shader-errors-panel summary, #import-warnings-panel summary {
        padding: 12px 0;
        cursor: pointer;
      }
      #shader-errors-panel {
        min-width: 0;
      }
      #import-warnings-panel[hidden] { display: none; }
      #import-warnings { white-space: pre-wrap; overflow-wrap: anywhere; color: #e8c782; font-size: 13px; }
      .local-file-control { display: flex; flex-direction: column; gap: 4px; max-width: 260px; }
      .local-file-control input { max-width: 100%; }
      #shader-errors {
        margin: 0 0 12px;
        max-height: 240px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.5 ui-monospace, monospace;
        color: #f3b6b6;
      }
      #material-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0 0 12px;
        border: 0;
        min-width: 0;
      }
      #material-controls label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        font-size: 13px;
        color: #a8a8b0;
      }
      #material-folders { display: contents; }
      #material-controls select {
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }
      #material-parameters {
        border: 0;
        padding: 0 0 12px;
        margin: 0;
        min-width: 0;
      }
      #material-parameters p, .parameter-row small {
        font-size: 12px;
        color: #a8a8b0;
      }
      .parameter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 8px;
        margin-top: 12px;
        max-height: 340px;
        overflow: auto;
      }
      .parameter-row {
        min-width: 0;
        border: 1px solid #3a3a44;
        border-radius: 4px;
      }
      .parameter-row legend { font-size: 12px; overflow-wrap: anywhere; }
      .parameter-values { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
      .parameter-values input { min-width: 0; width: 100%; }
      .parameter-values input[type="checkbox"] { width: auto; min-height: 32px; }
      .parameter-values input[type="color"] { max-width: 44px; }
      .parameter-values input[type="number"], #material-parameters button {
        background: #1c1c22;
        color: #e6e6e6;
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 6px;
        min-height: 32px;
      }
      #material-parameters:disabled { opacity: 0.6; }
      @media (max-width: 600px) {
        #material-controls {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      #backend-mode {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid #3a3a44;
        border-radius: 4px;
      }
      #backend-mode button, #pathtracing-toggle {
        padding: 5px 10px;
        min-height: 36px;
        border: 0;
        color: #e6e6e6;
        background: #1c1c22;
        font: inherit;
        cursor: pointer;
      }
      #pathtracing-toggle {
        min-width: 112px;
        border: 1px solid #3a3a44;
        border-radius: 4px;
      }
      #pathtracing-toggle:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #pathtracing-toggle:focus-visible {
        outline: 2px solid #91d5c4;
        outline-offset: 2px;
      }
      #pathtracing-denoise-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        cursor: pointer;
      }
      #backend-mode button + button {
        border-left: 1px solid #3a3a44;
      }
      #backend-mode button[aria-pressed="true"] {
        color: #fff;
        background: #315c53;
      }
      #backend-mode button:focus-visible {
        outline: 2px solid #91d5c4;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <label for="scene">Scene</label>
        <select id="scene"></select>
        <label class="local-file-control">Ouvrir GLB/glTF + ressources
          <input id="local-scene-files" type="file" multiple title="Sélectionner un GLB, ou un glTF avec ses fichiers .bin et textures." />
        </label>
        <label class="local-file-control">Ouvrir un dossier glTF
          <input id="local-scene-folder" type="file" webkitdirectory multiple title="Sélectionner un dossier contenant une seule scène GLB/glTF et ses ressources." />
        </label>
        <label for="resolution">Resolution</label>
        <select id="resolution">
          <option value="256">256 x 256</option>
          <option value="512" selected>512 x 512</option>
          <option value="1024">1024 x 1024</option>
        </select>
        <label for="raster-quality">Raster quality</label>
        <select id="raster-quality" title="Interactive: 16 filtered environment samples. Reference: 64 samples with MIS, slower. Path tracing is unchanged.">
          <option value="interactive" selected>Interactive (filtered IBL)</option>
          <option value="reference">Reference (64 samples)</option>
        </select>
        <span id="backend-label">Mode</span>
        <div id="backend-mode" role="group" aria-labelledby="backend-label">
          <button type="button" data-backend="raster" aria-pressed="true">Raster</button>
          <button type="button" data-backend="pathtracing" aria-pressed="false">Path tracing</button>
        </div>
        <button id="pathtracing-toggle" type="button" disabled title="Mettre le path tracer en pause">
          <span id="pathtracing-toggle-icon" aria-hidden="true">&#10074;&#10074;</span>
          <span id="pathtracing-toggle-label">Pause</span>
        </button>
        <span id="pathtracing-spp" hidden title="Samples par pixel"></span>
        <label id="pathtracing-denoise-label" for="pathtracing-denoise" title="Denoiser JS neuronal sur WebGPU, chargé à la demande avec son modèle local. Approximation d'affichage LDR après un passage complet ; désactiver pour voir le rendu brut.">
          <input id="pathtracing-denoise" type="checkbox" />
          Denoiser JS (neural)
        </label>
      </div>
      <details id="materials-panel">
        <summary>Matériaux</summary>
        <fieldset id="material-controls" disabled>
          <label for="material-object">Objet<select id="material-object"></select></label>
          <div id="material-folders"></div>
          <label for="material-file">Matériau<select id="material-file"></select></label>
        </fieldset>
        <details id="parameters-panel">
          <summary>Paramètres du matériau</summary>
          <fieldset id="material-parameters" disabled aria-label="Paramètres du matériau"></fieldset>
        </details>
      </details>
      <details id="shader-errors-panel">
        <summary>Erreurs WGSL (<span id="shader-error-count" aria-live="polite">0</span>)</summary>
        <pre id="shader-errors">Aucune erreur WGSL.</pre>
      </details>
      <details id="import-warnings-panel" hidden open>
        <summary>Avertissements d'import glTF</summary>
        <pre id="import-warnings" role="status" aria-live="polite"></pre>
      </details>
      <div id="status" role="alert" hidden></div>
      <div id="canvas-container">
        <canvas id="view" width="512" height="512" aria-busy="true"></canvas>
        <span id="busy-indicator" role="status" aria-live="polite">Chargement / compilation...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
