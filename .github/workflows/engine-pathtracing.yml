name: Engine path tracing (GPU runner)

# GitHub-hosted runners have no GPU and SwiftShader is too slow for path tracing,
# so this workflow needs a self-hosted runner labelled `webgpu` with Chrome and a
# WebGPU-capable GPU. It runs on demand, or on every push and pull request once
# the repository variable WEBGPU_RUNNER is set to `true`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pathtracing:
    if: github.event_name == 'workflow_dispatch' || vars.WEBGPU_RUNNER == 'true'
    runs-on: [self-hosted, webgpu]
    timeout-minutes: 30
    env:
      MX_CORE_DIR: ${{ github.workspace }}/dist/materialx
      MX_LIB_ROOT: ${{ github.workspace }}/dist/materialx/libraries
    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout MaterialX
        uses: actions/checkout@v5
        with:
          repository: rvaquette/MaterialX
          ref: bea1e9251d8f936a73930ad19a6f3b37265d46f5
          path: materialx
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8

      - run: npm ci

      - name: Build minimal MaterialX Core and static site
        run: npm run build
        env:
          MX_SOURCE_DIR: ${{ github.workspace }}/materialx

      - name: Raster and path-traced headless captures
        run: npm run test:headless-capture

      - name: Golden path-traced renders
        run: npm run test:golden -- --gpu

      - name: Installed package, raster and path tracing
        run: npm run test:engine-package
        env:
          MX_CAPTURE_PATH_TRACING: '1'

      - name: Automated path-traced renders through the public API
        run: npm run render:engine -- --backend pathtracing --samples 16 --material examples/engine/orange.mtlx --out renders

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-pathtracing-renders
          path: renders/
          if-no-files-found: ignore
