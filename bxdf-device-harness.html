<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaterialX familles BxDF - harnais device (deux backends)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
    </style>
  </head>
  <body>
    <h1>Harnais device familles BxDF (T059c)</h1>
    <div id="log"></div>
    <script type="module">
      import { bootstrap } from '/tests/render/bxdf-device.harness.ts';
      bootstrap().catch((e) => {
        globalThis.__MX_BXDF_ERROR__ = String(e && e.message ? e.message : e);
        const p = document.createElement('p');
        p.textContent = 'Echec: ' + globalThis.__MX_BXDF_ERROR__;
        document.body.appendChild(p);
      });
    </script>
  </body>
