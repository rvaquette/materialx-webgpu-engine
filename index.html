<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaterialX WebGPU Engine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      canvas {
        flex: none;
        width: 512px;
        max-width: 100%;
        height: auto;
        aspect-ratio: 1;
        align-self: center;
        display: block;
        object-fit: contain;
        touch-action: none;
        user-select: none;
      }
      #status {
        padding: 8px 12px;
        font-size: 13px;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #26262c;
      }
      #toolbar label {
        font-size: 13px;
        color: #a8a8b0;
      }
      #toolbar select, #material-controls select, #material-controls input {
        background: #1c1c22;
        color: #e6e6e6;
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 13px;
        min-height: 44px;
        max-width: 100%;
      }
      #materials-panel, #shader-errors-panel {
        border-bottom: 1px solid #26262c;
        padding: 0 12px;
      }
      #materials-panel summary, #shader-errors-panel summary {
        padding: 12px 0;
        cursor: pointer;
      }
      #shader-errors-panel {
        min-width: 0;
      }
      #shader-errors {
        margin: 0 0 12px;
        max-height: 240px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 12px/1.5 ui-monospace, monospace;
        color: #f3b6b6;
      }
      #material-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0 0 12px;
        border: 0;
        min-width: 0;
      }
      #material-controls label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        font-size: 13px;
        color: #a8a8b0;
      }
      #material-controls select, #material-controls input {
        width: 100%;
        box-sizing: border-box;
        min-width: 0;
      }
      @media (max-width: 600px) {
        #material-controls {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      #backend-mode {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid #3a3a44;
        border-radius: 4px;
      }
      #backend-mode button, #pathtracing-toggle {
        padding: 5px 10px;
        min-height: 36px;
        border: 0;
        color: #e6e6e6;
        background: #1c1c22;
        font: inherit;
        cursor: pointer;
      }
      #pathtracing-toggle {
        min-width: 112px;
        border: 1px solid #3a3a44;
        border-radius: 4px;
      }
      #pathtracing-toggle:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #pathtracing-toggle:focus-visible {
        outline: 2px solid #91d5c4;
        outline-offset: 2px;
      }
      #backend-mode button + button {
        border-left: 1px solid #3a3a44;
      }
      #backend-mode button[aria-pressed="true"] {
        color: #fff;
        background: #315c53;
      }
      #backend-mode button:focus-visible {
        outline: 2px solid #91d5c4;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <label for="scene">Scene</label>
        <select id="scene"></select>
        <label for="resolution">Resolution</label>
        <select id="resolution">
          <option value="256">256 x 256</option>
          <option value="512" selected>512 x 512</option>
          <option value="1024">1024 x 1024</option>
        </select>
        <label for="raster-quality">Raster quality</label>
        <select id="raster-quality" title="Interactive: 16 filtered environment samples. Reference: 64 samples with MIS, slower. Path tracing is unchanged.">
          <option value="interactive" selected>Interactive (filtered IBL)</option>
          <option value="reference">Reference (64 samples)</option>
        </select>
        <span id="backend-label">Mode</span>
        <div id="backend-mode" role="group" aria-labelledby="backend-label">
          <button type="button" data-backend="raster" aria-pressed="true">Raster</button>
          <button type="button" data-backend="pathtracing" aria-pressed="false">Path tracing</button>
        </div>
        <button id="pathtracing-toggle" type="button" disabled title="Mettre le path tracer en pause">
          <span id="pathtracing-toggle-icon" aria-hidden="true">&#10074;&#10074;</span>
          <span id="pathtracing-toggle-label">Pause</span>
        </button>
      </div>
      <details id="materials-panel">
        <summary>Matériaux</summary>
        <fieldset id="material-controls" disabled>
          <label for="material-object">Objet<select id="material-object"></select></label>
          <label for="material-filter">Rechercher<input id="material-filter" type="search" autocomplete="off" /></label>
          <label for="material-file">Matériau<select id="material-file"></select></label>
        </fieldset>
      </details>
      <details id="shader-errors-panel">
        <summary>Erreurs WGSL (<span id="shader-error-count" aria-live="polite">0</span>)</summary>
        <pre id="shader-errors">Aucune erreur WGSL.</pre>
      </details>
      <div id="status">Initializing…</div>
      <canvas id="view" width="512" height="512"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
