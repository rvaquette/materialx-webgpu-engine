name: Headless WebGPU raster capture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout MaterialX
        uses: actions/checkout@v5
        with:
          repository: rvaquette/MaterialX
          ref: bea1e9251d8f936a73930ad19a6f3b37265d46f5
          path: materialx
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify raster captures in Chrome
        run: |
          google-chrome --version
          npm run test:headless-capture
        env:
          MX_CAPTURE_RASTER_ONLY: '1'
          MX_CORE_DIR: ${{ github.workspace }}/materialx/javascript/build/bin
          MX_LIB_ROOT: ${{ github.workspace }}/materialx/libraries
