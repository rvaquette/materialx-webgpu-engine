<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaterialX - rendu raster/path-trace USD sur GPU device</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; }
      img { image-rendering: pixelated; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <h1>Scene USD rendue sur le GPU (raster ou path-trace)</h1>
    <div id="log"></div>
    <script type="module">
      import { bootstrapUsdImage } from '/tests/render/usd-scene.harness.ts';
      let rendering = false;
      globalThis.__MX_RENDER__ = async (search) => {
      if (rendering) throw new Error('A render is already running');
      rendering = true;
      delete globalThis.__MX_IMAGE__;
      delete globalThis.__MX_SKIPPED__;
      document.getElementById('log').replaceChildren();
      const params = new URLSearchParams(search);
      const entry = params.get('entry') ?? '/scenes/test_material_disney_gold/test_material_disney_gold.usda';
      const res = Number(params.get('res') ?? 256);
      const spp = Number(params.get('spp') ?? 192);
      const maxDepth = params.has('maxDepth') ? Number(params.get('maxDepth')) : undefined;
      const tileSpp = Number(params.get('tileSpp') ?? 1);
      if (!Number.isInteger(tileSpp) || tileSpp < 1) throw new Error('tileSpp must be a positive integer');
      const backend = params.get('backend') === 'raster' ? 'raster' : 'pathtracing';
      const openpbr = params.get('openpbr') ?? undefined;
      const exposureParam = params.get('exposure');
      const exposure = exposureParam !== null ? Number(exposureParam) : undefined;
      const fireflyParam = params.get('firefly');
      const firefly = fireflyParam !== null ? Number(fireflyParam) : undefined;
      const skyPowerParam = params.get('skyPower');
      const skyPower = skyPowerParam !== null ? Number(skyPowerParam) : undefined;
      const skyColorParam = params.get('skyColor');
      const skyColor = skyColorParam
        ? skyColorParam.split(',').map((v) => Number(v.trim()))
        : undefined;
      const camBackParam = params.get('camBack');
      const camBack = camBackParam !== null ? Number(camBackParam) : undefined;
      const dispScaleParam = params.get('dispScale');
      const dispScale = dispScaleParam !== null ? Number(dispScaleParam) : undefined;
      const shadowsParam = params.get('shadows');
      const shadows = shadowsParam !== null && shadowsParam !== '0' && shadowsParam !== 'false';
      const lightDirParam = params.get('lightDir');
      const lightDir = lightDirParam ? lightDirParam.split(',').map(Number) : undefined;
      try {
      if (maxDepth !== undefined && (!Number.isInteger(maxDepth) || maxDepth < 1 || maxDepth > 64)) {
        throw new Error('maxDepth must be an integer from 1 to 64');
      }
      const removedOptions = ['workgroup', 'bvh', 'sampler', 'seed', 'bsdf', 'profileTraversal',
        'profileShading', 'profileReplayFirst', 'bvhCheck', 'bvhTest', 'samplingTest',
        'profileTest', 'shadingProfile', 'bsdfTest', 'architectureTest', 'referenceSpp'];
      const removedOption = removedOptions.find(option => params.has(option));
      if (removedOption) throw new Error(`Unsupported benchmark option: ${removedOption}`);
      const cacheMode = params.get('cache') ?? 'use';
      if (!['use', 'bypass', 'refresh', 'verify'].includes(cacheMode)) throw new Error('Invalid cache mode');
      const benchmark = params.has('benchmark') ? { cacheMode } : undefined;
      await bootstrapUsdImage(entry, res, spp, backend, openpbr, exposure, firefly, skyPower, skyColor, camBack, dispScale, shadows, lightDir, tileSpp, benchmark, maxDepth);
      } catch (e) {
        globalThis.__MX_IMAGE__ = null;
        const p = document.createElement('p');
        p.textContent = 'Echec: ' + (e && e.message ? e.message : e);
        document.getElementById('log').appendChild(p);
      } finally {
        rendering = false;
      }
      };
      if (!new URLSearchParams(location.search).has('session')) globalThis.__MX_RENDER__(location.search);
    </script>
  </body>
</html>
