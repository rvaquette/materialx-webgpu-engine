<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaterialX WebGPU Engine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      canvas {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        display: block;
      }
      #status {
        padding: 8px 12px;
        font-size: 13px;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #26262c;
      }
      #toolbar label {
        font-size: 13px;
        color: #a8a8b0;
      }
      #scene {
        background: #1c1c22;
        color: #e6e6e6;
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <label for="scene">Scene</label>
        <select id="scene"></select>
      </div>
      <div id="status">Initializing…</div>
      <canvas id="view"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
