name: Headless WebGPU raster capture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout MaterialX
        uses: actions/checkout@v5
        with:
          repository: rvaquette/MaterialX
          ref: bea1e9251d8f936a73930ad19a6f3b37265d46f5
          path: materialx
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the engine API contract and element adapter
        run: |
          node --test scripts/engine-api.test.mjs
          npx vitest run tests/engine.test.ts tests/engine-element.test.ts

      - name: Verify raster captures in Chrome
        run: |
          google-chrome --version
          npm run test:headless-capture
        env:
          MX_CAPTURE_RASTER_ONLY: '1'
          MX_CORE_DIR: ${{ github.workspace }}/materialx/javascript/build/bin
          MX_LIB_ROOT: ${{ github.workspace }}/materialx/libraries

      - name: Golden raster renders (SwiftShader)
        run: npm run test:golden
        env:
          MX_CORE_DIR: ${{ github.workspace }}/materialx/javascript/build/bin
          MX_LIB_ROOT: ${{ github.workspace }}/materialx/libraries

      - name: Keep golden differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-differences
          path: renders/golden/
          if-no-files-found: ignore
